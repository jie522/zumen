<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D47A1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZUMEN">
<title>ZUMEN 手機版</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* 主色沿用電腦版（PDS 藍 #1565C0），手機上加深一階做頂部背景 */
  --brand:#1565C0; --brand-d:#0D47A1; --brand-dd:#0A2F6B; --brand-l:#E3F0FD;
  --accent:#FF8F00; --green:#2E7D32; --red:#C62828;
  --bg:#EEF2F6; --card:#fff; --line:#E3E8EE; --line-2:#F1F4F7;
  --ink:#16202C; --ink-2:#4F6070; --ink-3:#93A1AF;
  --mono:'JetBrains Mono',Consolas,monospace;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input{font-family:inherit}
svg{display:block}
.hidden{display:none!important}

/* ═══ 首頁頂部 ═══ */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(160deg,var(--brand-d) 0%,var(--brand-dd) 100%);color:#fff;padding:calc(var(--safe-t) + 14px) 16px 16px;box-shadow:0 6px 20px rgba(10,47,107,.25)}
.top-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:34px;height:34px;border-radius:10px;background:#fff;display:grid;place-items:center;flex-shrink:0}
.brand-t{font-weight:900;font-size:19px;letter-spacing:.5px}
.brand-s{font-size:11.5px;opacity:.7;margin-top:-2px}
.conn{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12px;background:rgba(255,255,255,.12);padding:5px 11px;border-radius:20px}
.conn i{width:7px;height:7px;border-radius:50%;background:#FFB74D}
.conn.on i{background:#69F0AE;box-shadow:0 0 0 3px rgba(105,240,174,.25)}
.search{position:relative}
.search input{width:100%;height:48px;border-radius:14px;border:none;padding:0 46px 0 46px;font-size:16px;background:#fff;color:var(--ink);outline:none;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.search input::placeholder{color:var(--ink-3)}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
/* 搜尋對象：圖面 / 檔案（比照 ZUMEN 搜尋結果頁右上的切換） */
.kind{display:flex;gap:4px;margin-top:12px;background:rgba(255,255,255,.12);border-radius:12px;padding:4px}
.kind button{flex:1;height:34px;border-radius:9px;color:rgba(255,255,255,.8);font-size:14.5px;font-weight:700}
.kind button.on{background:#fff;color:var(--brand-d)}
.item .cat-b{display:inline-block;font-size:11px;font-weight:700;color:var(--brand);background:var(--brand-l);border-radius:6px;padding:1px 7px;margin-bottom:3px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
.item .fname{font-size:14.5px;font-weight:500;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .of{font-size:12px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid .item .fname{font-size:13.5px}
.thumb .fic{position:absolute;inset:0;margin:auto}
.search .s-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--brand)}
.search .s-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.search .s-x:active{background:var(--line-2)}

/* ═══ 首頁清單 ═══ */
.home-body{padding:14px 12px calc(var(--safe-b) + 24px)}
.sec-t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink-2);margin:6px 6px 10px;letter-spacing:.3px}
.sec-t .cnt{margin-left:auto;font-weight:500;color:var(--ink-3);font-size:12px}
.recent{display:flex;gap:8px;overflow-x:auto;padding:0 4px 14px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.rchip{flex-shrink:0;max-width:200px;background:var(--card);border-radius:12px;padding:9px 12px;box-shadow:0 1px 2px rgba(16,32,44,.06);text-align:left}
.rchip:active{transform:scale(.97)}
.rchip b{display:block;font-family:var(--mono);font-size:12px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip span{display:block;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:var(--r);padding:10px;box-shadow:0 1px 2px rgba(16,32,44,.06);text-align:left;width:100%;transition:transform .12s}
.item:active{transform:scale(.985);background:#F8FAFC}
.thumb{width:72px;height:72px;border-radius:12px;background:var(--line-2);flex-shrink:0;overflow:hidden;display:grid;place-items:center;color:var(--ink-3);border:1px solid var(--line-2)}
.thumb{position:relative}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.item .info{flex:1;min-width:0}
.dno{font-family:var(--mono);font-weight:700;font-size:13.5px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.pname{font-size:15px;font-weight:500;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--ink-3);margin-top:4px}
.chev{color:#C5CFD9;flex-shrink:0}
/* 預覽模式：比照 ZUMEN 網頁的大圖卡片，手機上兩欄 */
.list.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid .item{flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;border:1px solid var(--line)}
.grid .thumb{width:100%;height:auto;aspect-ratio:1/1;border-radius:0;border:none;border-bottom:1px solid var(--line-2);background:#fff}
.grid .thumb img{padding:6px}
.grid .info{padding:9px 10px 11px}
.grid .dno{font-size:12.5px;color:var(--ink);letter-spacing:0}
.grid .pname{font-size:13.5px;font-weight:400;color:var(--ink-2)}
.grid .meta,.grid .chev{display:none}
.grid .empty{grid-column:1/-1}
.vtog{display:flex;background:#fff;border-radius:10px;padding:3px;margin-left:8px;box-shadow:0 1px 2px rgba(16,32,44,.06)}
.vtog button{width:34px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-3)}
.vtog button.on{background:var(--brand-l);color:var(--brand)}
@media(min-width:560px){.list.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
mark{background:#FFE082;color:inherit;border-radius:3px;padding:0 1px}
.more{padding:22px;text-align:center;color:var(--ink-3);font-size:13px}
.empty{padding:60px 20px;text-align:center;color:var(--ink-3)}
.empty svg{margin:0 auto 12px;color:#C5CFD9}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* skeleton */
.sk{background:linear-gradient(90deg,#E8EDF2 25%,#F3F6F9 50%,#E8EDF2 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{to{background-position:-200% 0}}

/* ═══ 詳細頁 ═══ */
.view{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.view.show{transform:none}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:calc(var(--safe-t) + 8px) 8px 8px;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.bar.scrolled{border-bottom-color:var(--line)}
.ibtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex-shrink:0}
.ibtn:active{background:rgba(0,0,0,.06)}
.bar .bt{flex:1;min-width:0;font-family:var(--mono);font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .2s}
.bar.scrolled .bt{opacity:1}
.det{padding:0 12px calc(var(--safe-b) + 110px)}
.hero{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 1px 3px rgba(16,32,44,.08)}
.hero-img{height:230px;display:grid;place-items:center;background:#fff;border-bottom:1px solid var(--line-2);position:relative}
.hero-img img{max-width:100%;max-height:100%;object-fit:contain}
.hero-img .zoom{position:absolute;right:10px;bottom:10px;background:rgba(22,32,44,.72);color:#fff;font-size:12px;padding:5px 10px;border-radius:20px;display:flex;gap:5px;align-items:center}
.hero-txt{padding:14px 16px 16px}
.hero-txt .dno{font-size:16px;white-space:normal;word-break:break-all}
.hero-txt .pname{font-size:18px;font-weight:700;-webkit-line-clamp:unset;margin-top:4px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.fld{background:var(--bg);border-radius:10px;padding:8px 10px;min-width:0}
.fld small{display:block;font-size:11px;color:var(--ink-3)}
.fld span{display:block;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.memo{margin-top:10px;font-size:13px;color:var(--ink-2);background:#FFF8E1;border-radius:10px;padding:8px 10px;white-space:pre-wrap}

.block{margin-top:18px}
.block-h{display:flex;align-items:center;gap:8px;padding:0 4px 10px;font-size:16px;font-weight:700}
.block-h .tag{font-size:12px;font-weight:700;background:var(--brand);color:#fff;border-radius:10px;padding:1px 8px}
.block-h .side{margin-left:auto;font-size:12.5px;font-weight:500;color:var(--ink-3)}

/* 影片卡片 */
.vids{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:0 16px 4px;margin:0 -12px;scrollbar-width:none}
.vids::-webkit-scrollbar{display:none}
.vcard{flex-shrink:0;width:220px;scroll-snap-align:start;text-align:left}
.vcard:active{transform:scale(.98)}
.vposter{position:relative;width:220px;height:132px;border-radius:14px;overflow:hidden;background:#1B2633;display:grid;place-items:center}
.vposter video,.vposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.vposter .play{position:relative;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--brand-d);box-shadow:0 4px 14px rgba(0,0,0,.3)}
.vposter .vext{position:absolute;left:8px;top:8px;font-family:var(--mono);font-size:10.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:5px;text-transform:uppercase}
.vcard .vn{font-size:13.5px;font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vcard .vm{font-size:11.5px;color:var(--ink-3)}
.vempty{background:#fff;border-radius:var(--r);padding:18px;display:flex;gap:14px;align-items:center;color:var(--ink-2);font-size:13.5px}
.vempty .ve-ic{width:44px;height:44px;border-radius:12px;background:var(--brand-l);color:var(--brand);display:grid;place-items:center;flex-shrink:0}

/* 分類籤 */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;margin:0 -12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;background:#fff;color:var(--ink-2);font-size:13.5px;font-weight:500;display:flex;align-items:center;gap:6px;box-shadow:0 1px 2px rgba(16,32,44,.06);white-space:nowrap}
.tab .n{font-size:11.5px;font-weight:700;min-width:20px;height:20px;border-radius:10px;background:var(--line-2);color:var(--ink-3);display:grid;place-items:center;padding:0 5px}
.tab.has .n{background:var(--brand-l);color:var(--brand)}
.tab.on{background:var(--brand);color:#fff}
.tab.on .n{background:rgba(255,255,255,.25);color:#fff}
.tab.zero{opacity:.55}
.tab-sep{flex-shrink:0;align-self:center;font-size:11px;color:var(--ink-3);padding:0 2px;font-weight:700}
.files{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(16,32,44,.06)}
.file{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;border-bottom:1px solid var(--line-2)}
.file:last-child{border-bottom:none}
.file:active{background:#F5F8FB}
.fic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase}
.fic.v{background:#FFE9E3;color:#D84315}
.fic.i{background:#E3F6EC;color:#2E7D32}
.fic.p{background:#FDE7EA;color:#C62828}
.fic.x{background:#E5F4E8;color:#1B5E20}
.fic.o{background:var(--line-2);color:var(--ink-2)}
.file .fn{font-size:14.5px;font-weight:500;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.file .fm{font-size:12px;color:var(--ink-3);margin-top:2px}
.file .info{flex:1;min-width:0}
.fempty{padding:28px 16px;text-align:center;color:var(--ink-3);font-size:13.5px}

/* 浮動上傳鈕 */
.fab{position:fixed;right:16px;bottom:calc(var(--safe-b) + 18px);z-index:45;height:56px;padding:0 22px 0 18px;border-radius:28px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(255,143,0,.45);transform:translateY(120px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.fab.show{transform:none}
.fab:active{transform:scale(.96)}

/* 上傳進度膠囊 */
.jobs-pill{position:fixed;left:16px;bottom:calc(var(--safe-b) + 24px);z-index:46;background:var(--ink);color:#fff;border-radius:22px;height:44px;padding:0 16px;display:flex;align-items:center;gap:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 200px)}
.jobs-pill .spin{width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.3);border-top-color:#fff}

/* ═══ 底部面板 ═══ */
.scrim{position:fixed;inset:0;background:rgba(10,20,32,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:22px 22px 0 0;max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:8px 16px calc(var(--safe-b) + 18px)}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{font-size:18px;font-weight:700}
.sheet .sub{font-size:13px;color:var(--ink-3);margin-top:2px;font-family:var(--mono)}
.lbl{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:18px 0 8px}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{height:38px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);font-size:14px;font-weight:500;color:var(--ink-2);background:#fff}
.cat.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand-d);font-weight:700}
.txt{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);padding:0 14px;font-size:16px;outline:none;color:var(--ink)}
.txt:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(21,101,192,.14)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick{position:relative;border-radius:16px;background:var(--bg);padding:16px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--ink)}
.pick .pi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff}
.pick:active{transform:scale(.96)}
.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.chosen{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.cfile{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:10px}
.cfile .cprev{width:64px;height:64px;border-radius:10px;overflow:hidden;background:#1B2633;flex-shrink:0;display:grid;place-items:center;color:#fff}
.cfile .cprev video,.cfile .cprev img{width:100%;height:100%;object-fit:cover}
.cfile .info{flex:1;min-width:0}
.cfile .fn{font-size:14px;font-weight:500;word-break:break-all}
.cfile .fm{font-size:12px;color:var(--ink-3)}
.bigbtn{width:100%;height:52px;border-radius:14px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.bigbtn:disabled{background:#B0BEC5}
.bigbtn:active:not(:disabled){background:var(--brand-d)}
.bigbtn.ghost{background:var(--bg);color:var(--ink)}
.job{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.job:last-child{border-bottom:none}
.job .info{flex:1;min-width:0}
.job .fn{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .fm{font-size:12px;color:var(--ink-3);margin-top:2px}
.pbar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .3s}
.pbar.ind i{width:35%!important;animation:ind 1.3s infinite ease-in-out}
@keyframes ind{0%{transform:translateX(-100%)}100%{transform:translateX(290%)}}
.jst{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.jst.ok{background:#E3F6EC;color:var(--green)}
.jst.err{background:#FDE7EA;color:var(--red)}

/* ═══ 檢視器 ═══ */
.viewer{position:fixed;inset:0;z-index:80;background:#05080C;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .2s}
.viewer.show{opacity:1;pointer-events:auto}
.vbar{display:flex;align-items:center;gap:8px;padding:calc(var(--safe-t) + 8px) 8px 8px;color:#fff;background:linear-gradient(#05080C,rgba(5,8,12,0))}
.vbar .ibtn{color:#fff}
.vbar .ibtn:active{background:rgba(255,255,255,.12)}
.vbar .vt{flex:1;min-width:0;font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbody{flex:1;position:relative;overflow:hidden;min-height:0;display:flex;align-items:center;justify-content:center}
/* Safari 在 flex 子元素裡算不出 max-height:100%，直式影片會超出畫面被切掉；改成絕對定位填滿再 contain */
.vbody video,.vbody > img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vbody img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
.vmsg{color:#CBD5E1;text-align:center;padding:30px;font-size:14.5px;line-height:1.7}
.vmsg .big{width:72px;height:72px;border-radius:20px;background:rgba(255,255,255,.08);display:grid;place-items:center;margin:0 auto 16px;font-family:var(--mono);font-weight:700;text-transform:uppercase;color:#fff}
.vmsg a{display:inline-flex;align-items:center;gap:8px;margin-top:18px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;padding:12px 22px;border-radius:14px}
.vfoot{padding:10px 16px calc(var(--safe-b) + 12px);color:#8FA0B2;font-size:12px;text-align:center}
/* 表格預覽（白底，可上下左右捲動） */
.sheet-wrap{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column}
.sh-tabs{flex-shrink:0;display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#EEF2F6;scrollbar-width:none}
.sh-tabs button{flex-shrink:0;padding:6px 12px;border-radius:8px;background:#fff;color:var(--ink-2);font-size:13px;font-weight:500}
.sh-tabs button.on{background:var(--brand);color:#fff}
.sh-body{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px}
.sh-body table{border-collapse:collapse;min-width:100%;font-size:13.5px;color:var(--ink)}
.sh-body td,.sh-body th{border:1px solid #CFD8DC;padding:7px 10px;white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.sh-body tr.hd td{background:#E8F5E9;font-weight:700;text-align:center}
.sh-body tr:nth-child(even) td{background:#FAFBFC}
/* 文件第一頁預覽 */
.pv-doc{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:12px 12px 20px;gap:12px}
.pv-doc img{width:100%;max-width:640px;background:#fff;border-radius:6px}
.pv-cap{color:#8FA0B2;font-size:12.5px}
.pv-open{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--ink);text-decoration:none;font-weight:700;padding:12px 22px;border-radius:14px}
.vgo{margin-top:10px;width:100%;min-height:46px;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;font-size:14px;font-weight:700;padding:8px 14px;display:flex;align-items:center;justify-content:center;gap:6px}
.vgo span{font-family:var(--mono);color:#90CAF9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ═══ 遮罩畫面 ═══ */
.gate{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--brand-d),var(--brand-dd));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.gate .logo{width:72px;height:72px;border-radius:20px;margin-bottom:18px}
.gate h2{font-size:22px;font-weight:900;letter-spacing:.5px}
.gate p{opacity:.75;font-size:14px;margin-top:6px}
.gate .pin{margin-top:26px;width:220px;height:56px;border-radius:16px;border:none;text-align:center;font-size:26px;letter-spacing:10px;outline:none;font-family:var(--mono)}
.gate .bigbtn{width:220px;background:var(--accent)}
.gate .err{color:#FFCDD2;font-size:13.5px;margin-top:10px;min-height:20px}
.spin{width:22px;height:22px;border:2.5px solid rgba(21,101,192,.2);border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite}
.gate .spin{width:30px;height:30px;border-color:rgba(255,255,255,.25);border-top-color:#fff;margin-top:24px}
@keyframes rot{to{transform:rotate(360deg)}}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-140%);z-index:120;background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast.ok{background:var(--green)}
.toast.err{background:var(--red)}

@media(min-width:700px){
  .home-body,.det{max-width:720px;margin:0 auto}
  .top-inner{max-width:720px;margin:0 auto}
  .sheet{max-width:560px;margin:0 auto}
}

  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>

  <symbol id="i-zoom" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></symbol>

<div class="gate" id="gate">
  <div class="logo"><svg width="46" height="46"><use href="#i-logo"/></svg></div>
  <h2>ZUMEN 手機版</h2>
  <p id="gateMsg">連線中…</p>
  <div id="gateBody"><div class="spin"></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (id, s = 20) => `<svg width="${s}" height="${s}"><use href="#i-${id}"/></svg>`;
const VIDEO_EXT = ['mp4','mov','m4v','webm','3gp','avi','mkv','wmv','mts'];
const PLAYABLE = ['mp4','mov','m4v','webm','3gp'];
const IMAGE_EXT = ['png','jpg','jpeg','gif','webp','bmp','heic'];
const isVideo = f => VIDEO_EXT.includes(f.extension);

let PIN = '';
try { PIN = localStorage.getItem('zm_pin') || ''; } catch (_) {}

async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), 'x-pin': PIN } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && d.needPin) { showPinGate(); throw new Error('請輸入通行碼'); }
  if (!r.ok) throw new Error(d.error || `連線錯誤 (${r.status})`);
  return d;
}

let toastT;
function toast(msg, kind = '') {
  const t = $('toast');
  t.textContent = msg; t.className = 'toast show ' + kind;
  clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast ' + kind, 3000);
}
const fmtDate = s => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? '' : `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`; };
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
// 「1️⃣技術資料(含影片)」「8.生產日報表」「🆖品質異常」→ 去掉前綴，籤上比較乾淨
const cleanName = n => String(n || '').replace(/^[\s\d.️⃣🆖ℹ🎦]+/u, '') || n;

/* ── 啟動 / 通行碼 ── */
async function boot() {
  try {
    const a = await fetch('/api/auth', { headers: { 'x-pin': PIN } }).then(r => r.json());
    if (a.needPin && !a.ok) return showPinGate();
  } catch (_) { $('gateMsg').textContent = '連不到伺服器，請確認電腦端已開啟、手機連在同一個 Wi-Fi'; return; }
  waitReady();
}
function showPinGate(err = '') {
  $('gate').classList.remove('hidden');
  $('gateMsg').textContent = '請輸入通行碼';
  $('gateBody').innerHTML = `<input class="pin" id="pinIn" type="password" inputmode="numeric" autocomplete="off">
    <div class="err">${esc(err)}</div><button class="bigbtn" onclick="submitPin()">進入</button>`;
  setTimeout(() => $('pinIn')?.focus(), 100);
  $('pinIn').onkeydown = e => { if (e.key === 'Enter') submitPin(); };
}
async function submitPin() {
  PIN = $('pinIn').value.trim();
  const a = await fetch('/api/auth', { headers: { 'x-pin': PIN } }).then(r => r.json()).catch(() => ({}));
  if (!a.ok) return showPinGate('通行碼不正確');
  try { localStorage.setItem('zm_pin', PIN); } catch (_) {}
  $('gateBody').innerHTML = '<div class="spin"></div>';
  waitReady();
}
async function waitReady() {
  $('gateMsg').textContent = '正在連線 ZUMEN…';
  for (let i = 0; ; i++) {
    try {
      const s = await api('/api/status');
      if (s.ready) break;
      if (s.error) $('gateMsg').textContent = 'ZUMEN 登入失敗：' + s.error;
    } catch (e) { if (e.message === '請輸入通行碼') return; }
    await new Promise(r => setTimeout(r, i < 10 ? 1500 : 4000));
  }
  $('conn').classList.add('on'); $('conn').querySelector('span').textContent = '已連線';
  $('gate').classList.add('hidden');
  // 分類名稱先載好：檔案搜尋結果要顯示每個檔案在哪個分類
  try { D.types = (await api('/api/doc-types')).types; } catch (_) {}
  renderRecent();
  search('');
  route();
}

/* ── 搜尋 / 清單 ── */
const S = { q: '', page: 1, last: 1, loading: false, seq: 0, items: [], kind: 'drawing' };
try { S.kind = localStorage.getItem('zm_kind') === 'file' ? 'file' : 'drawing'; } catch (_) {}
// 搜尋對象：圖面（圖號/品名）或 檔案（檔名，含所有分類的文件）
function setKind(k, rerun = true) {
  S.kind = k;
  try { localStorage.setItem('zm_kind', k); } catch (_) {}
  $('kDrawing').classList.toggle('on', k === 'drawing');
  $('kFile').classList.toggle('on', k === 'file');
  $('q').placeholder = k === 'file' ? '搜尋檔案名稱，例如 261021、報價' : '搜尋圖號、品名、關鍵字';
  if (rerun) search($('q').value.trim());
}
setKind(S.kind, false);
let qT;
$('q').addEventListener('input', e => {
  $('qx').classList.toggle('hidden', !e.target.value);
  clearTimeout(qT); qT = setTimeout(() => search(e.target.value.trim()), 350);
});
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { clearTimeout(qT); search(e.target.value.trim()); e.target.blur(); } });
$('qx').onclick = () => { $('q').value = ''; $('qx').classList.add('hidden'); search(''); $('q').focus(); };

// 預覽（大圖兩欄，預設）/ 清單（小圖一列一筆），記在手機上
function setMode(m) {
  try { localStorage.setItem('zm_mode', m); } catch (_) {}
  $('list').classList.toggle('grid', m === 'grid');
  $('vtGrid').classList.toggle('on', m === 'grid');
  $('vtList').classList.toggle('on', m !== 'grid');
}
let initMode = 'grid';
try { initMode = localStorage.getItem('zm_mode') || 'grid'; } catch (_) {}
setMode(initMode);

function skeleton(n = 6) {
  return Array.from({ length: n }, () => `<div class="item"><div class="thumb sk"></div><div class="info">
    <div class="sk" style="height:13px;width:60%"></div><div class="sk" style="height:15px;width:85%;margin-top:8px"></div>
    <div class="sk" style="height:11px;width:30%;margin-top:8px"></div></div></div>`).join('');
}
function hl(text) {
  const t = esc(text);
  if (!S.q) return t;
  const words = S.q.split(/\s+/).filter(Boolean).map(w => esc(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return words.length ? t.replace(new RegExp(`(${words.join('|')})`, 'gi'), '<mark>$1</mark>') : t;
}
function itemHtml(x) {
  return `<button class="item" onclick="openDrawing(${x.id})">
    <div class="thumb">${icon('doc', 26)}${x.thumbnail_url ? `<img src="${esc(x.thumbnail_url)}" loading="lazy" alt="" onerror="this.remove()">` : ''}</div>
    <div class="info">
      <div class="dno">${hl(x.drawing_number || '（無圖號）')}</div>
      <div class="pname">${hl(x.product_name || '（無品名）')}</div>
      <div class="meta">更新 ${fmtDate(x.updated_at)}</div>
    </div>
    <svg class="chev" width="20" height="20"><use href="#i-chev"/></svg>
  </button>`;
}
const typeName = id => id === 'drawing' ? '圖面' : cleanName(D.types.find(t => t.id === id)?.name) || '文件';
function fileItemHtml(f, i) {
  const owner = f.drawing ? [f.drawing.drawing_number, f.drawing.product_name].filter(Boolean).join(' · ') : '';
  return `<button class="item" onclick="openFoundFile(${i})">
    <div class="thumb">${fileIc(f)}${f.thumbnail_url ? `<img src="${esc(f.thumbnail_url)}" loading="lazy" alt="" onerror="this.remove()">` : ''}</div>
    <div class="info">
      <span class="cat-b">${esc(typeName(f.type))}</span>
      <div class="fname">${hl(f.name || '（未命名）')}</div>
      <div class="of">${esc(owner)}</div>
    </div>
    <svg class="chev" width="20" height="20"><use href="#i-chev"/></svg>
  </button>`;
}
// 兩種搜尋共用分頁／無限捲動，只是打的 API 和每筆的長相不同
async function fetchPage(page) {
  if (S.kind === 'file') {
    const d = await api(`/api/files/search?page=${page}&q=${encodeURIComponent(S.q)}`);
    return { rows: d.files, last: d.last_page, total: 0 };
  }
  const d = await api(`/api/drawings?page=${page}&q=${encodeURIComponent(S.q)}`);
  return { rows: d.drawings, last: d.last_page, total: d.total };
}
function rowsHtml(rows, offset) {
  return S.kind === 'file' ? rows.map((f, i) => fileItemHtml(f, offset + i)).join('') : rows.map(itemHtml).join('');
}
async function search(q) {
  const seq = ++S.seq;
  Object.assign(S, { q, page: 1, last: 1, items: [], loading: true });
  const isFile = S.kind === 'file';
  $('listTitle').textContent = q ? `「${q}」的${isFile ? '檔案' : '圖面'}搜尋結果` : (isFile ? '檔案搜尋' : '最新更新');
  $('listCnt').textContent = '';
  $('recentWrap').classList.toggle('hidden', !!q || !getRecent().length);
  $('more').textContent = '';
  if (isFile && !q) {
    S.loading = false;
    $('list').innerHTML = `<div class="empty">${icon('doc', 44)}<b>搜尋所有分類的檔案</b>輸入檔名的一部分，例如日期 261021、「報價」、「操作影片」</div>`;
    return;
  }
  $('list').innerHTML = skeleton();
  try {
    const d = await fetchPage(1);
    if (seq !== S.seq) return;
    S.items = d.rows; S.last = d.last;
    $('listCnt').textContent = d.total ? `共 ${d.total} 筆` : '';
    if (!d.rows.length) {
      $('list').innerHTML = `<div class="empty">${icon('search', 44)}<b>找不到符合的${isFile ? '檔案' : '圖面'}</b>${isFile ? '試試看檔名的一部分' : '試試看圖號的一部分'}，或換個關鍵字</div>`;
    } else $('list').innerHTML = rowsHtml(d.rows, 0);
    updateMore();
  } catch (e) {
    if (seq !== S.seq) return;
    $('list').innerHTML = `<div class="empty">${icon('warn', 44)}<b>載入失敗</b>${esc(e.message)}</div>`;
  } finally { if (seq === S.seq) S.loading = false; }
}
function updateMore() { $('more').textContent = S.page < S.last ? '載入更多…' : (S.items.length ? '— 已經到底了 —' : ''); }
async function loadMore() {
  if (S.loading || S.page >= S.last) return;
  S.loading = true; const seq = S.seq;
  try {
    const d = await fetchPage(S.page + 1);
    if (seq !== S.seq) return;

function route() {
  const m = location.hash.match(/^#d=(\d+)/);
  closeOverlays();
  if (m) { if (String(D.id) !== m[1] || !$('view').classList.contains('show')) showDrawing(m[1]); }
  else {

// 畫面上的「返回／關閉」不能只靠 history.back()：從主畫面圖示直接開在圖面頁時沒有上一頁，

  setTimeout(() => {
    if (location.hash !== before) return;

// 上傳分兩段：①手機→電腦（顯示 % 進度）②電腦→ZUMEN（背景工作，輪詢結果）。
// 第②段可以離開這個畫面，右下角膠囊會持續顯示進度
const jobs = [];
function startUpload() {
  const base = $('upName').value.trim();
  const target = { id: D.id, dno: D.data.drawing_number, type: U.type };
  U.files.forEach((file, i) => {
    const name = base ? (U.files.length > 1 ? `${base}_${i + 1}` : base) : '';
    const job = { name: (name || file.name), file, ...target, phase: 'send', pct: 0, msg: '傳送到電腦中…' };
    jobs.push(job); sendJob(job, name);
  });
  U.files = [];
  goBack();
  toast('已開始上傳，可以繼續瀏覽', 'ok');
  renderJobs();
}
function sendJob(job, name) {
  const xhr = new XMLHttpRequest();

  xhr.setRequestHeader('x-pin', PIN);
  xhr.upload.onprogress = e => { if (e.lengthComputable) { job.pct = Math.round(e.loaded / e.total * 100); renderJobs(); } };
  xhr.onload = () => {
    let d = {}; try { d = JSON.parse(xhr.responseText); } catch (_) {}
    if (xhr.status >= 300 || !d.jobId) return failJob(job, d.error || `傳送失敗 (${xhr.status})`);
    job.phase = 'zumen'; job.msg = '排隊中…'; job.jobId = d.jobId; job.file = null; renderJobs(); pollJob(job);
  };
  xhr.onerror = () => failJob(job, '網路中斷，請重新上傳');
  const fd = new FormData(); fd.append('file', job.file);
  xhr.send(fd);
}
function failJob(job, msg) { job.phase = 'error'; job.msg = msg; renderJobs(); toast('上傳失敗：' + job.name, 'err'); }
async function pollJob(job) {
  for (;;) {
    await new Promise(r => setTimeout(r, 3000));
    try {
      const s = await api('/api/jobs/' + job.jobId);
      job.msg = s.message;
      if (s.state === 'done') {
        job.phase = 'done'; renderJobs(); toast('上傳完成：' + job.name, 'ok');
        if (String(D.id) === String(job.id)) refreshFiles();
        return;
      }
      if (s.state === 'error') return failJob(job, s.message);
      renderJobs();
    } catch (e) { if (/找不到/.test(e.message)) return failJob(job, e.message); }
  }
}
async function refreshFiles() {
  const seq = D.seq;
  try {
    const f = await api(`/api/drawings/${D.id}/all-files`);
    if (seq !== D.seq) return;
    D.byType = f.byType; renderVideos(); renderTabs(); renderFiles();
  } catch (_) {}
}
function renderJobs() {
  const active = jobs.filter(j => j.phase === 'send' || j.phase === 'zumen');
  $('jobsPill').classList.toggle('hidden', !active.length);
  if (active.length) {
    const j = active[0];
    $('jobsTxt').textContent = (j.phase === 'send' ? `傳送到電腦 ${j.pct}%` : (j.msg || 'ZUMEN 處理中').replace(/（[\d.]+MB）/, ''))
      + (active.length > 1 ? `（共 ${active.length} 個）` : '');
  }
  if ($('jobList')) $('jobList').innerHTML = jobsHtml();
}
function jobsHtml() {
  if (!jobs.length) return '<div class="fempty">目前沒有上傳</div>';
  return jobs.slice().reverse().map(j => `<div class="job">
    ${j.phase === 'done' ? `<span class="jst ok">${icon('check', 18)}</span>` : j.phase === 'error' ? `<span class="jst err">${icon('warn', 18)}</span>` : '<span class="spin"></span>'}
    <div class="info"><div class="fn">${esc(j.name)}</div><div class="fm">${esc(j.dno)} · ${esc(j.phase === 'send' ? `傳送到電腦 ${j.pct}%` : j.msg)}</div>
    ${j.phase === 'send' ? `<div class="pbar"><i style="width:${j.pct}%"></i></div>` : j.phase === 'zumen' ? '<div class="pbar ind"><i></i></div>' : ''}</div></div>`).join('');
}
function openJobs() {
  $('sheet').innerHTML = `<div class="grab"></div><h3>上傳進度</h3>
    <div style="font-size:13px;color:var(--ink-3);margin-top:4px">「ZUMEN 處理中」時可以關掉這個畫面；傳送到電腦的階段請勿關閉網頁</div>
    <div id="jobList" style="margin-top:8px">${jobsHtml()}</div>
    <button class="bigbtn ghost" onclick="goBack()">關閉</button>`;
  pushOverlay('j');
  $('scrim').classList.add('show'); $('sheet').classList.add('show');
}
window.addEventListener('beforeunload', e => { if (jobs.some(j => j.phase === 'send')) { e.preventDefault(); e.returnValue = ''; } });

// 重新整理時若停在 overlay 狀態，先回到乾淨的 hash
if (location.hash.includes('~')) history.replaceState(null, '', location.hash.split('~')[0]);
// 直接開在圖面頁（主畫面圖示、重新整理）時，底下補一層首頁，讓手機的返回手勢也能回首頁
if (location.hash.startsWith('#d=')) {
  const h = location.hash;
  history.replaceState(null, '', location.pathname + location.search);
  history.pushState(null, '', h);
}
boot();
</script>
</body>
</html>
