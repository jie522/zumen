<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手機連線</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;min-height:100vh;background:linear-gradient(160deg,#0D47A1,#0A2F6B);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;color:#16202C;border-radius:24px;padding:28px 32px 32px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:460px;width:100%}
.tabs{display:flex;background:#EEF2F6;border-radius:14px;padding:4px;margin-bottom:22px}
.tabs button{flex:1;border:none;background:none;font:inherit;font-size:15px;font-weight:700;color:#4F6070;padding:10px 6px;border-radius:10px;cursor:pointer}
.tabs button.on{background:#fff;color:#1565C0;box-shadow:0 1px 3px rgba(0,0,0,.1)}
h1{font-size:22px;font-weight:900}
p{color:#4F6070;margin-top:6px;font-size:14.5px}
#qr{margin:22px auto 16px;width:220px;height:220px}
#qr img,#qr canvas{width:220px!important;height:220px!important}
.url{font-family:Consolas,monospace;font-size:17px;font-weight:700;color:#1565C0;background:#E3F0FD;border-radius:12px;padding:10px 14px;word-break:break-all}
.alt{margin-top:10px;font-size:13px;color:#93A1AF}
.none{margin:22px 0 4px;background:#FFF8E1;color:#7A4F01;border-radius:14px;padding:18px;font-size:14px;line-height:1.8;text-align:left}
ol{text-align:left;margin:20px 0 0 20px;color:#4F6070;font-size:14px;line-height:1.9}
a{color:#1565C0}
</style>
</head>
<body>
<div class="card">
  <div class="tabs">
    <button id="tLan" onclick="show('lan')">🏢 公司 Wi-Fi</button>
    <button id="tTs" onclick="show('tailscale')">🌏 外出（Tailscale）</button>
  </div>
  <div id="body">讀取中…</div>
</div>
<script>
let info = { lan: [], tailscale: [] };
const TEXT = {
  lan: { h: '📱 用手機掃描', p: '手機要連在跟這台電腦同一個 Wi-Fi',
         steps: ['用手機相機掃上面的 QR Code', '開啟後按瀏覽器的「分享」→「加入主畫面」', '之後從主畫面的 ZUMEN 圖示直接開'] },
  tailscale: { h: '🌏 在外面也能用', p: '手機要先安裝 Tailscale 並登入同一個帳號',
         steps: ['手機安裝 Tailscale App，登入跟這台電腦同一個帳號', '確認 Tailscale App 是「Connected / 已連線」', '用手機相機掃上面的 QR Code，再「加入主畫面」',
                 '4G/5G、家裡 Wi-Fi 都能用（這台電腦要開著）'] }
};
function show(kind) {
  document.getElementById('tLan').classList.toggle('on', kind === 'lan');
  document.getElementById('tTs').classList.toggle('on', kind === 'tailscale');
  const t = TEXT[kind], [first, ...rest] = info[kind] || [];
  const steps = `<ol>${t.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
  if (!first) {
    document.getElementById('body').innerHTML = `<h1>${t.h}</h1>` + (kind === 'tailscale'
      ? `<div class="none"><b>這台電腦還沒安裝 Tailscale</b><br>
         1. 到 <a href="https://tailscale.com/download/windows" target="_blank">tailscale.com/download</a> 下載安裝<br>
         2. 安裝後登入（可用 Google 帳號）<br>
         3. 重新整理這一頁，就會出現外出用的 QR Code</div>`
      : `<div class="none">找不到這台電腦的網路位址，請確認已連上網路</div>`);
    return;
  }
  document.getElementById('body').innerHTML = `<h1>${t.h}</h1><p>${t.p}</p><div id="qr"></div>
    <div class="url">${first}</div><div class="alt">${rest.length ? '其他位址：' + rest.join('、') : ''}</div>${steps}`;
  new QRCode(document.getElementById('qr'), { text: first, width: 440, height: 440, correctLevel: QRCode.CorrectLevel.M });
}
fetch('/api/connect-info').then(r => r.json()).then(d => { info = d; show(d.tailscale.length ? 'tailscale' : 'lan'); })
  .catch(() => document.getElementById('body').textContent = '伺服器沒有回應');
</script>
</body>
</html>
