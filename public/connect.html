<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手機連線</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC','Microsoft JhengHei',sans-serif;min-height:100vh;background:linear-gradient(160deg,#0D47A1,#0A2F6B);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:#fff;color:#16202C;border-radius:24px;padding:36px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);max-width:440px;width:100%}
h1{font-size:24px;font-weight:900}
p{color:#4F6070;margin-top:6px;font-size:15px}
#qr{margin:26px auto 18px;width:240px;height:240px}
#qr img,#qr canvas{width:240px!important;height:240px!important}
.url{font-family:Consolas,monospace;font-size:17px;font-weight:700;color:#1565C0;background:#E3F0FD;border-radius:12px;padding:10px 14px;word-break:break-all}
.alt{margin-top:10px;font-size:13px;color:#93A1AF}
ol{text-align:left;margin:22px 0 0 20px;color:#4F6070;font-size:14px;line-height:1.9}
</style>
</head>
<body>
<div class="card">
  <h1>📱 用手機掃描</h1>
  <p>手機要連在跟這台電腦同一個 Wi-Fi</p>
  <div id="qr"></div>
  <div class="url" id="url">讀取中…</div>
  <div class="alt" id="alt"></div>
  <ol>
    <li>用手機相機掃上面的 QR Code</li>
    <li>開啟後按瀏覽器的「分享」→「加入主畫面」</li>
    <li>之後從主畫面的 ZUMEN 圖示直接開</li>
  </ol>
</div>
<script>
fetch('/api/connect-info').then(r => r.json()).then(d => {
  const [first, ...rest] = d.urls;
  if (!first) { document.getElementById('url').textContent = '找不到這台電腦的網路位址，請確認已連上網路'; return; }
  document.getElementById('url').textContent = first;
  if (rest.length) document.getElementById('alt').textContent = '其他位址：' + rest.join('、');
  new QRCode(document.getElementById('qr'), { text: first, width: 480, height: 480, correctLevel: QRCode.CorrectLevel.M });
}).catch(() => document.getElementById('url').textContent = '伺服器沒有回應');
</script>
</body>
</html>
